services:
  - type: web
    name: ckd-screening-system
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python ml/train.py"
    startCommand: "gunicorn app:app"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: ""
      - key: APP_BASE_URL
        value: https://ckd-screening-system.onrender.com
      - key: EMAIL_REPORT_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
